server {
    listen 80;
    server_name openrights.fortravels.xyz;
    include snippets/deny-dotfiles.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/ai {
        proxy_pass http://127.0.0.1:8104/api/ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 301 https://openrights.fortravels.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openrights.fortravels.xyz;
    root /var/www/openrights;
    index index.html;
    include snippets/deny-dotfiles.conf;

    location = /api/ai {
        proxy_pass http://127.0.0.1:8104/api/ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    ssl_certificate /etc/letsencrypt/live/openrights.fortravels.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openrights.fortravels.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
